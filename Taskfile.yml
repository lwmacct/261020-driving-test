# Taskfile.yml
# https://taskfile.dev

version: "3"
dotenv: [".env", ".env.example", "{{.HOME}}/.env"]

vars:
  TASK_REMOTE: "github.com/lwmacct/251207-task-remote.git/"

includes:
  env:
    taskfile: https://{{.TASK_REMOTE}}/.task/env.yml?ref=main
    optional: true
    flatten: true

  git:
    taskfile: https://{{.TASK_REMOTE}}/.task/git.yml?ref=main
    optional: true

  ci:
    taskfile: .task/ci.yml
    optional: true

  fluentbit:
    taskfile: internal/testutil/fluentbit/Taskfile.yml
    dir: internal/testutil/fluentbit
    optional: true
